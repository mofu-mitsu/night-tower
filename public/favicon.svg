<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景プレート -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 背景の月/コアグリフ -->
  <circle cx="32" cy="18" r="8" fill="#06b6d4" opacity="0.15" />

  <!-- タワー構造体 (ネオンタワーシルエット) -->
  <g filter="url(#neonGlow)">
    <!-- アンテナの光 -->
    <circle cx="32" cy="7" r="2" fill="#38bdf8" />
    <line x1="32" y1="7" x2="32" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- 展望台 1 (高層) -->
    <path d="M27 16 H37 L39 21 H25 Z" fill="url(#towerGrad)" />
    <line x1="24" y1="21" x2="40" y2="21" stroke="#f472b6" stroke-width="1.5" />

    <!-- 塔身 (中層トラス) -->
    <path d="M28 21 L25 35 H39 L36 21 Z" fill="none" stroke="url(#towerGrad)" stroke-width="1.8" />
    <line x1="28" y1="22" x2="38" y2="34" stroke="#a855f7" stroke-width="1.2" opacity="0.8" />
    <line x1="36" y1="22" x2="26" y2="34" stroke="#a855f7" stroke-width="1.2" opacity="0.8" />

    <!-- 展望台 2 (メインデッキ) -->
    <path d="M22 35 H42 L45 42 H19 Z" fill="url(#towerGrad)" />
    <rect x="23" y="37" width="18" height="3" rx="1" fill="#090d16" />
    <circle cx="32" cy="38.5" r="1" fill="#facc15" />

    <!-- 塔脚 (アーチ＆ベース) -->
    <path d="M20 42 L13 57 H23 L28 47 Q32 44 36 47 L41 57 H51 L44 42 Z" fill="url(#towerGrad)" />
    <!-- トラス筋 -->
    <line x1="18" y1="44" x2="25" y2="56" stroke="#ec4899" stroke-width="1.2" opacity="0.7" />
    <line x1="46" y1="44" x2="39" y2="56" stroke="#ec4899" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- 地表ネオンライン -->
  <line x1="10" y1="57" x2="54" y2="57" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
