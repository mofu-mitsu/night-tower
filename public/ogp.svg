<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- 外枠ネオンボーダー -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />

  <!-- タワーの幾何学シルエット（右側） -->
  <g transform="translate(760, 60)" opacity="0.85">
    <!-- アンテナ光 -->
    <circle cx="200" cy="40" r="8" fill="#38bdf8" />
    <line x1="200" y1="40" x2="200" y2="120" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    
    <!-- 展望台トップ -->
    <polygon points="160,120 240,120 260,160 140,160" fill="url(#neonCyan)" />
    <!-- 中層トラス -->
    <line x1="150" y1="160" x2="250" y2="280" stroke="#a855f7" stroke-width="3" />
    <line x1="250" y1="160" x2="150" y2="280" stroke="#a855f7" stroke-width="3" />
    <polygon points="130,280 270,280 290,340 110,340" fill="url(#neonPink)" />
    <!-- ベース脚 -->
    <polygon points="120,340 60,500 130,500 180,410 220,410 270,500 340,500 280,340" fill="url(#neonCyan)" opacity="0.9" />
  </g>

  <!-- 左側テキストエリア -->
  <g transform="translate(80, 140)">
    <!-- パンくずバッジ -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="20" y="23" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#38bdf8">
      Ni lab ＞ NIGHT TOWER
    </text>

    <!-- メインタイトル -->
    <text x="0" y="110" font-family="sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="2">
      NIGHT TOWER
    </text>

    <!-- サブタイトル -->
    <text x="0" y="165" font-family="sans-serif" font-size="28" font-weight="700" fill="url(#neonPink)">
      性格構造と欺瞞の深層診断
    </text>

    <!-- キャッチコピー -->
    <text x="0" y="230" font-family="sans-serif" font-size="18" fill="#94a3b8">
      夜の摩天楼を昇り、住人たちの理不尽な罠を突破せよ。
    </text>
    <text x="0" y="260" font-family="sans-serif" font-size="18" fill="#94a3b8">
      心理機能・エニアグラム・深層の欺瞞から己の正体を解き明かす。
    </text>

    <!-- キャラクターアイコン列 -->
    <g transform="translate(0, 310)">
      <text font-size="36">🥺 🐦 🐷 💪 🦗 🌱 🦋</text>
    </g>
  </g>
</svg>
